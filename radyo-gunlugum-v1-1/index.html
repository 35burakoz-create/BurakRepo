<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radyo Günlüğüm V1.1</title><style>:root{--b:#ece9df;--p:#fffdf8;--i:#20251f;--m:#6b6f65;--a:#374332;--l:#cbc6b7;--d:#8a3f35}*{box-sizing:border-box}body{margin:0;background:#ece9df;color:var(--i);font:14px system-ui}.shell{max-width:1200px;margin:auto;padding:16px}h1,h2{font-family:Georgia,serif}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.sub{color:var(--m)}.panel,.auth{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:16px;margin:12px 0}.auth{max-width:420px;margin:60px auto}.hidden{display:none!important}.tabs{display:flex;gap:6px}.tab,.ghost,.primary{padding:9px 12px;border-radius:9px;border:1px solid var(--l);cursor:pointer}.tab,.ghost{background:transparent}.tab.active,.primary{background:var(--a);color:white}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.span2{grid-column:span 2}label{display:flex;flex-direction:column;gap:5px;font-weight:650}input,select,textarea{padding:9px;border:1px solid var(--l);border-radius:8px;background:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#30372f;color:white;border-radius:10px;padding:12px}.stat b{font-size:24px;display:block}.filters{display:grid;grid-template-columns:1.3fr .8fr .8fr;gap:7px}.card{border:1px solid var(--l);border-radius:10px;padding:12px;margin:8px 0;background:white}.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.badge{display:inline-block;padding:3px 7px;background:#e6eadf;border-radius:999px;font-size:11px;font-weight:700}.ok{background:#d7e5d1}.danger{color:var(--d)}.msg{color:var(--d);font-size:13px}.user{display:flex;gap:8px;align-items:center}@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:560px){.shell{padding:10px}.top{align-items:flex-start;flex-direction:column}.form,.filters{grid-template-columns:1fr}.span2{grid-column:auto}}</style></head><body><main class="shell"><header class="top"><div><small>TECSUN R-9012 • SAHA GÜNLÜĞÜ</small><h1>Radyo Günlüğüm</h1><div class="sub">V1.1 — kayıtlar bulutta saklanır ve cihazlar arasında senkronize olur.</div></div><div id="user" class="user hidden"><span id="email"></span><button id="out" class="ghost">Çıkış</button></div></header><section id="auth" class="auth"><div class="tabs"><button class="tab active" data-m="login">Giriş</button><button class="tab" data-m="signup">Kayıt Ol</button></div><form id="af"><p><label>E-posta<input id="ae" type="email" required></label></p><p><label>Şifre<input id="ap" type="password" minlength="8" required></label></p><button id="as" class="primary">Giriş Yap</button></form><p id="am" class="msg"></p></section><section id="app" class="hidden"><div id="stats" class="stats"></div><div class="grid"><section class="panel"><div class="row"><h2 id="ft">Yeni Kayıt</h2><button id="cancel" class="ghost hidden" type="button">İptal</button></div><form id="lf" class="form"><input id="id" type="hidden"><label>Tarih<input id="date" type="date" required></label><label>Saat<input id="time" type="time" required></label><label>Bant<select id="band"></select></label><label>Frekans<input id="freq" type="number" step="0.001" required></label><label>İstasyon<input id="station"></label><label>Dil<input id="lang"></label><label class="span2">Program / İçerik<input id="program"></label><label class="span2">Konum<input id="loc" value="Bozköy, Torbalı, İzmir"></label><label>Sinyal<select id="signal"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Durum<select id="status"><option value="candidate">Aday</option><option value="confirmed">Doğrulandı</option></select></label><label class="span2">Notlar<textarea id="notes" rows="3"></textarea></label><div class="span2"><button id="save" class="primary">Kaydı Ekle</button> <span id="fm" class="msg"></span></div></form></section><section class="panel"><div class="row"><h2>Kayıtlar</h2><button id="csv" class="ghost">CSV İndir</button></div><div class="filters"><input id="q" placeholder="İstasyon, dil, frekans..."><select id="fb"><option value="">Tüm bantlar</option></select><input id="fd" type="date"></div><div id="records"></div></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://mesbtntnclokgzgunept.supabase.co',K='sb_publishable_sUZxv1oXvj8y3oOKhXGNtw_BwoiREML',S=supabase.createClient(U,K),$=x=>document.querySelector(x),B=['FM','MW','SW1','SW2','SW3','SW4','SW5','SW6','SW7','SW8','SW9','SW10'];let mode='login',logs=[],me=null;for(const e of [$('#band'),$('#fb')])for(const b of B){let o=document.createElement('option');o.value=b;o.textContent=b;e.appendChild(o)}function now(){let d=new Date(),x=new Date(d-d.getTimezoneOffset()*60000).toISOString();$('#date').value=x.slice(0,10);$('#time').value=x.slice(11,16)}now();function show(u){me=u;$('#auth').classList.toggle('hidden',!!u);$('#app').classList.toggle('hidden',!u);$('#user').classList.toggle('hidden',!u);if(u)$('#email').textContent=u.email}async function load(){if(!me)return;let{data,error}=await S.from('radio_logs').select('*').eq('user_id',me.id).order('date',{ascending:false}).order('time',{ascending:false});if(error)throw error;logs=data||[];render()}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');mode=t.dataset.m;$('#as').textContent=mode==='login'?'Giriş Yap':'Kayıt Ol';$('#am').textContent=''});$('#af').onsubmit=async e=>{e.preventDefault();$('#am').textContent='';let email=$('#ae').value.trim(),password=$('#ap').value;try{if(mode==='login'){let{data,error}=await S.auth.signInWithPassword({email,password});if(error)throw error;show(data.user);await load()}else{let{data,error}=await S.auth.signUp({email,password});if(error)throw error;if(data.session){show(data.user);await load()}else $('#am').textContent='Kayıt oluşturuldu. E-postanı doğruladıktan sonra giriş yap.'}e.target.reset()}catch(x){$('#am').textContent=x.message}};$('#out').onclick=async()=>{await S.auth.signOut();logs=[];show(null)};S.auth.onAuthStateChange(async(_,s)=>{show(s?.user||null);if(s?.user)try{await load()}catch{}});async function boot(){let{data:{session}}=await S.auth.getSession();show(session?.user||null);if(session?.user)await load()}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('#q').value.toLowerCase(),b=$('#fb').value,d=$('#fd').value,f=logs.filter(x=>(!b||x.band===b)&&(!d||x.date===d)&&(!q||[x.station,x.language,x.frequency,x.program,x.location].join(' ').toLowerCase().includes(q)));let u=new Set(logs.map(x=>x.station?.trim().toLowerCase()).filter(Boolean)).size;$('#stats').innerHTML=[['Toplam',logs.length],['Doğrulandı',logs.filter(x=>x.status==='confirmed').length],['İstasyon',u],['Sinyal 5',logs.filter(x=>+x.signal_strength===5).length]].map(x=>`<div class=stat><b>${x[1]}</b>${x[0]}</div>`).join('');$('#records').innerHTML=f.length?f.map(x=>`<div class=card><div class=row><div><b>${esc(x.station||'İsimsiz kayıt')}</b><br><span class=badge>${esc(x.band)} • ${Number(x.frequency).toLocaleString('tr-TR')} ${x.band==='FM'?'MHz':'kHz'}</span></div><span class="badge ${x.status==='confirmed'?'ok':''}">${x.status==='confirmed'?'Doğrulandı':'Aday'}</span></div><p>${esc(x.date)} ${esc(String(x.time).slice(0,5))} • ${esc(x.language||'')} • Sinyal ${x.signal_strength??'—'}/5</p><p>${esc(x.program||x.notes||'')}</p><div><button class=ghost data-e="${x.id}">Düzenle</button> <button class="ghost danger" data-d="${x.id}">Sil</button></div></div>`).join(''):'<p class=sub>Henüz kayıt yok.</p>'}['q','fb','fd'].forEach(i=>$('#'+i).addEventListener(i==='q'?'input':'change',render));$('#lf').onsubmit=async e=>{e.preventDefault();let id=$('#id').value,body={user_id:me.id,date:$('#date').value,time:$('#time').value,band:$('#band').value,frequency:+$('#freq').value,station:$('#station').value||null,language:$('#lang').value||null,program:$('#program').value||null,location:$('#loc').value||null,signal_strength:$('#signal').value?+$('#signal').value:null,notes:$('#notes').value||null,status:$('#status').value},r=id?await S.from('radio_logs').update(body).eq('id',id).eq('user_id',me.id):await S.from('radio_logs').insert(body);if(r.error){$('#fm').textContent=r.error.message;return}reset();await load();$('#fm').textContent='Kaydedildi.'};$('#records').onclick=async e=>{let a=e.target.closest('[data-e]'),d=e.target.closest('[data-d]');if(a){let x=logs.find(z=>z.id===a.dataset.e);$('#id').value=x.id;$('#date').value=x.date;$('#time').value=String(x.time).slice(0,5);$('#band').value=x.band;$('#freq').value=x.frequency;$('#station').value=x.station||'';$('#lang').value=x.language||'';$('#program').value=x.program||'';$('#loc').value=x.location||'';$('#signal').value=x.signal_strength??'';$('#notes').value=x.notes||'';$('#status').value=x.status;$('#ft').textContent='Kaydı Düzenle';$('#save').textContent='Değişiklikleri Kaydet';$('#cancel').classList.remove('hidden')}if(d&&confirm('Bu kaydı silmek istiyor musun?')){let r=await S.from('radio_logs').delete().eq('id',d.dataset.d).eq('user_id',me.id);if(!r.error)await load()}};function reset(){$('#lf').reset();$('#id').value='';$('#loc').value='Bozköy, Torbalı, İzmir';$('#status').value='candidate';now();$('#ft').textContent='Yeni Kayıt';$('#save').textContent='Kaydı Ekle';$('#cancel').classList.add('hidden')}$('#cancel').onclick=reset;$('#csv').onclick=()=>{let h=['Tarih','Saat','Bant','Frekans','İstasyon','Dil','Program','Konum','Sinyal','Durum','Notlar'],v=logs.map(x=>[x.date,String(x.time).slice(0,5),x.band,x.frequency,x.station,x.language,x.program,x.location,x.signal_strength,x.status,x.notes]),c='\ufeff'+[h,...v].map(r=>r.map(z=>'\"'+String(z??'').replaceAll('\"','\"\"')+'\"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='radyo-kayitlari.csv';a.click()};boot()</script></body></html>
