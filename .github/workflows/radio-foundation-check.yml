name: Radio Foundation Check

on:
  push:
    paths:
      - 'radyo-gunlugum-v2-no-sdr/**'
      - '.github/workflows/radio-foundation-check.yml'
  pull_request:
    paths:
      - 'radyo-gunlugum-v2-no-sdr/**'
      - '.github/workflows/radio-foundation-check.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          APP='radyo-gunlugum-v2-no-sdr'
          for f in \
            app-config.js core.js app-bootstrap.js \
            v44-search-rebuild.js \
            app-foundation.js app-toast.js app-pwa-install.js app-runtime-core.js app-auth-service.js app-router-core.js app-ui-state.js app-auth-ui.js \
            app-broadcast-locale.js app-current-programs.js app-guide-service.js app-language-service.js app-qsl-service.js app-record-service.js \
            app-record-integrity.js app-offline-service.js app-smart-analyzer.js \
            app-ai-service.js app-ai-ui.js app-achievements-service.js app-collection-ui.js \
            app-user-services.js app-listening-service.js app-atlas-service.js \
            app-shell-core.js app-menu-ui.js app-quick-log.js app-home-ui.js app-now-ui.js app-log-ui.js app-log-form-ui.js \
            app-audio-ui.js app-guide-ui.js app-analysis-ui.js app-map-ui.js app-calendar-ui.js app-qsl-ui.js \
            app-listening-ui.js app-atlas-ui.js app-propagation.js app-memory.js app-page-density.js app-radio-glossary.js \
            app-audio-safety.js app-backup.js app-pwa-updates.js app-smoke.js; do
            echo "Checking $f"
            node --check "$APP/$f"
          done
      - name: Foundation architecture regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/foundation-static-check.mjs
      - name: Mobile services regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/mobile-services-static-check.mjs
      - name: Guide modernization regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/guide-modernization-static-check.mjs
      - name: Direct legacy cleanup regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/direct-legacy-cleanup-static-check.mjs
      - name: Core boundary regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/core-boundary-static-check.mjs
      - name: Refresh routing regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/refresh-routing-static-check.mjs
      - name: Menu and visual regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/menu-visual-static-check.mjs
      - name: Deep application audit checks
        run: node radyo-gunlugum-v2-no-sdr/tests/deep-audit-static-check.mjs
      - name: Page density regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/page-density-static-check.mjs
      - name: Broadcast localization regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/broadcast-localization-static-check.mjs
      - name: Radio glossary regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/radio-glossary-static-check.mjs
      - name: Wide audit regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/wide-audit-static-check.mjs
      - name: QSL English report regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/qsl-english-report-static-check.mjs
      - name: Modal geometry regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/modal-geometry-static-check.mjs
