name: Radio Foundation Check

on:
  push:
    paths:
      - 'radyo-gunlugum-v2-no-sdr/**'
      - '.github/workflows/radio-foundation-check.yml'
  pull_request:
    paths:
      - 'radyo-gunlugum-v2-no-sdr/**'
      - '.github/workflows/radio-foundation-check.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          APP='radyo-gunlugum-v2-no-sdr'
          for f in \
            app-config.js app-insights.js app-bootstrap.js \
            v37-integrity-followup.js v39-navigation-state.js \
            v41-propagation-assistant.js v42-ui-polish.js \
            v44-search-rebuild.js app-foundation.js \
            app-memory.js app-smoke.js; do
            echo "Checking $f"
            node --check "$APP/$f"
          done
      - name: Foundation architecture regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/foundation-static-check.mjs
