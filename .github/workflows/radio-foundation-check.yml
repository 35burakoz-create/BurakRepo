name: Radio Foundation Check

on:
  push:
    paths:
      - 'radyo-gunlugum-v2-no-sdr/**'
      - '.github/workflows/radio-foundation-check.yml'
  pull_request:
    paths:
      - 'radyo-gunlugum-v2-no-sdr/**'
      - '.github/workflows/radio-foundation-check.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          APP='radyo-gunlugum-v2-no-sdr'
          for f in \
            app-config.js app-core-bridge.js app-insights.js app-bootstrap.js \
            v38-listening-mode.js v44-search-rebuild.js \
            app-foundation.js app-runtime-core.js app-router-core.js \
            app-current-programs.js app-record-integrity.js app-smart-analyzer.js \
            app-user-services.js app-shell.js app-propagation.js app-memory.js \
            app-audio-safety.js app-backup.js app-ui-state.js app-smoke.js; do
            echo "Checking $f"
            node --check "$APP/$f"
          done
      - name: Foundation architecture regression checks
        run: node radyo-gunlugum-v2-no-sdr/tests/foundation-static-check.mjs
