{% extends 'inventory/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h1>Rezervasyon Oluştur</h1>
    <p class="text-muted mb-0">{{ product.sku }} - {{ product.display_material_name }} / Satılabilir: {{ product.available_m2 }} m²</p>
  </div>
  <a class="btn btn-outline-secondary" href="{{ product.get_absolute_url }}">Detaya dön</a>
</div>
<div class="card"><div class="card-body"><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Rezervasyon oluştur</button></form></div></div>
{% endblock %}
